name: Build USB Phone Info APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Prepare Android project from app.zip
        shell: bash
        run: |
          set -e

          echo "Repository contents:"
          find . -maxdepth 2 -type f -print | sort

          if [ ! -f "app.zip" ]; then
            echo "ERROR: app.zip was not found."
            exit 1
          fi

          echo "Extracting app.zip..."

          rm -rf .app_extract
          mkdir -p .app_extract

          unzip -q "app.zip" -d ".app_extract"

          echo "Extracted files:"
          find .app_extract -maxdepth 5 -type f -print | sort | head -300

          rm -rf app

          if [ -d ".app_extract/app" ]; then
            echo "Found app/ directory inside ZIP."
            cp -a ".app_extract/app" "./app"

          elif [ -f ".app_extract/build.gradle" ] || [ -f ".app_extract/build.gradle.kts" ]; then
            echo "ZIP contains Android project files directly."
            mkdir -p app
            cp -a .app_extract/. app/

          else
            echo "Searching for Android app module..."

            APP_BUILD_FILE=$(find .app_extract -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print | head -1)

            if [ -z "$APP_BUILD_FILE" ]; then
              echo "ERROR: Could not find an Android Gradle project in app.zip."
              exit 1
            fi

            APP_DIR=$(dirname "$APP_BUILD_FILE")

            echo "Android module found at: $APP_DIR"

            cp -a "$APP_DIR" "./app"
          fi

          echo "Final Android app structure:"
          find app -maxdepth 4 -type f -print | sort | head -300

          if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle or app/build.gradle.kts not found."
            exit 1
          fi

          if [ ! -d "app/src" ]; then
            echo "ERROR: app/src directory was not found."
            exit 1
          fi

          rm -rf .app_extract

          echo "Android project preparation completed."

      - name: Check Gradle files
        shell: bash
        run: |
          echo "Root files:"
          ls -la

          echo
          echo "App files:"
          find app -maxdepth 3 -type f -print | sort | head -300

          echo
          echo "settings.gradle:"
          if [ -f settings.gradle ]; then
            cat settings.gradle
          elif [ -f settings.gradle.kts ]; then
            cat settings.gradle.kts
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        shell: bash
        run: |
          set -e

          echo "Starting Android build..."

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          APK_FILE=$(find . -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            echo
            echo "All APK files:"
            find . -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK generated successfully:"
          echo "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: USBPhoneInfo-Advanced-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
