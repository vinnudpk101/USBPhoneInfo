name: Build Technician Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Find Technician Pro ZIP
        shell: bash
        run: |
          echo "Searching for Technician Pro ZIP..."

          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' \
            \( -iname '*Technician*Pro*.zip' \
            -o -iname '*Technician*.zip' \
            -o -iname '*USBPhoneInfo*.zip' \) \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Technician Pro ZIP not found."
            echo "ZIP files available in repository:"
            find . -type f -name "*.zip" -print
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Technician Pro
        shell: bash
        run: |
          rm -rf project
          mkdir -p project

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d project

          echo "Extraction completed."

          find project -maxdepth 5 -type f | head -200

      - name: Locate Android project
        shell: bash
        run: |
          echo "Searching for Android Gradle project..."

          SETTINGS_FILE="$(find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android Gradle project not found."

            echo "Searching for Gradle files:"
            find project -type f \
              \( -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \) \
              -print

            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Inspect Android project
        shell: bash
        run: |
          echo "===== PROJECT FILES ====="

          find "$PROJECT_DIR" -maxdepth 5 -type f \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "gradlew" \) \
            -print

          echo "========================="

      - name: Fix Gravity import
        shell: bash
        run: |
          echo "Checking MainActivity files..."

          MAIN_FILE="$(find "$PROJECT_DIR" -type f \
            \( -name "MainActivity.java" -o -name "MainActivity.kt" \) \
            -print -quit)"

          if [ -n "$MAIN_FILE" ]; then
            echo "Found:"
            echo "$MAIN_FILE"

            if [[ "$MAIN_FILE" == *.java ]]; then
              sed -i \
                's/import[[:space:]]\+android\.view\.Gravity;/import android.view.Gravity;/' \
                "$MAIN_FILE" || true
            fi
          else
            echo "MainActivity not found. Continuing."
          fi

      - name: Check Gradle wrapper
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            echo "Gradle wrapper found."

            chmod +x ./gradlew

            echo "Gradle wrapper version:"
            ./gradlew --version || true
          else
            echo "No Gradle wrapper found."
            echo "Using system Gradle 8.7."
            gradle --version
          fi

      - name: Build Technician Pro APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "======================================"
          echo " Building Technician Pro APK"
          echo "======================================"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Locate APK
        shell: bash
        run: |
          echo "Searching for generated APK..."

          APK_FILE="$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."

            echo "Searching all APK files:"
            find "$PROJECT_DIR" -type f -name "*.apk" -print

            exit 1
          fi

          echo "======================================"
          echo " APK GENERATED SUCCESSFULLY"
          echo "======================================"
          echo "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      - name: Upload Technician Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: USBPhoneInfo-Technician-Pro-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
