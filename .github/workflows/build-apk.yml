name: Build Technician Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Find Technician Pro ZIP
        shell: bash
        run: |
          echo "Searching for Technician Pro package..."

          ZIP_FILE="$(find . -maxdepth 2 -type f \
            \( -iname '*Technician*Pro*.zip' \
            -o -iname '*USBPhoneInfo*Technician*Pro*.zip' \) \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Technician Pro ZIP not found."
            echo "Available ZIP files:"
            find . -type f -name "*.zip" -print
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Technician Pro
        shell: bash
        run: |
          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo "Extracted project:"
          find project -maxdepth 4 -type f | head -100

      - name: Locate Android project
        shell: bash
        run: |
          SETTINGS_FILE="$(find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android Gradle project not found."
            find project -maxdepth 6 -type f -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Gravity import
        shell: bash
        run: |
          echo "Checking for Gravity import problem..."

          MAIN_FILE="$(find "$PROJECT_DIR" -type f -name "MainActivity.java" -print -quit)"

          if [ -n "$MAIN_FILE" ]; then
            echo "MainActivity found:"
            echo "$MAIN_FILE"

            sed -i \
              's/import[[:space:]]\+android\.view\.Gravity;/import android.view.Gravity;/' \
              "$MAIN_FILE" || true

            echo "Gravity import check completed."
          else
            echo "MainActivity.java not found."
          fi

      - name: Show Gradle files
        shell: bash
        run: |
          echo "Gradle files:"
          find "$PROJECT_DIR" -maxdepth 4 -type f \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "gradlew" \) \
            -print

      - name: Build Technician Pro APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Building Technician Pro APK..."

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Locate APK
        shell: bash
        run: |
          echo "Searching for generated APK..."

          APK_FILE="$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            find "$PROJECT_DIR" -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK generated:"
          echo "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      - name: Upload Technician Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: USBPhoneInfo-Technician-Pro-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
