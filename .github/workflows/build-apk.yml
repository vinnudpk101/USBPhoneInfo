name: Build Technician Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Find Technician Pro ZIP
        shell: bash
        run: |
          echo "Searching for Technician Pro ZIP..."

          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' \
            -iname '*Technician*Pro*.zip' \
            -o -iname '*Technician*.zip' \
            -o -iname '*USBPhoneInfo*.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Technician Pro ZIP not found."
            echo "ZIP files available in repository:"
            find . -type f -name "*.zip" -print
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Technician Pro
        shell: bash
        run: |
          rm -rf project
          mkdir -p project

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d project

          echo "Extraction completed."

          find project -maxdepth 5 -type f | head -200

      - name: Locate Android project
        shell: bash
        run: |
          echo "Searching for Android Gradle project..."

          SETTINGS_FILE="$(find project -type f \
            -name "settings.gradle" -o -name "settings.gradle.kts" \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android Gradle project not found."

            echo "Searching
