name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q USBPhoneInfo_v4_Technician_Edition.zip -d project

      - name: Find Android project
        run: |
          echo "Searching for Gradle project..."
          find project -maxdepth 4 -name "settings.gradle" -o -name "settings.gradle.kts"

      - name: Build APK
        working-directory: project
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find project -type f -name "*.apk"

      - name: Upload Technician APK
        uses: actions/upload-artifact@v4
        with:
          name: USBPhoneInfo-Technician-v3-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
