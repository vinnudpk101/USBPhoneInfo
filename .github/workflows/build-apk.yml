name: Build Technician Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Find Technician Pro ZIP
        shell: bash
        run: |
          echo "Searching for Technician Pro package..."

          ZIP_FILE="$(find . -maxdepth 5 -type f \
            \( -iname "*Technician*Pro*.zip" \
            -o -iname "*Technician_Pro*.zip" \) \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Technician Pro ZIP not found."
            echo "Available ZIP files:"
            find . -type f -name "*.zip" -print
            exit 1
          fi

          echo "Found package: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Technician Pro
        shell: bash
        run: |
          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo "Extracted project:"
          find project -maxdepth 3 -type f | head -100

      - name: Locate Android project
        shell: bash
        run: |
          SETTINGS_FILE="$(find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android Gradle project not found."
            echo "Searching for Gradle files:"
            find project -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \
              -o -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Gravity import
        shell: bash
        run: |
          echo "Searching for MainActivity.java..."

          MAIN_FILE="$(find "$PROJECT_DIR" -type f \
            -name "MainActivity.java" \
            -print -quit)"

          if [ -z "$MAIN_FILE" ]; then
            echo "MainActivity.java not found."
            echo "Searching for Java source files:"
            find "$PROJECT_DIR" -type f -name "*.java" -print
            exit 1
          fi

          echo "MainActivity found:"
          echo "$MAIN_FILE"

          if grep -q "^import android.view.Gravity;" "$MAIN_FILE"; then
            echo "Gravity import already exists."
          else
            sed -i '/^package /a import android.view.Gravity;' "$MAIN_FILE"
            echo "Gravity import added."
          fi

          echo "Checking Gravity import:"
          grep -n "android.view.Gravity" "$MAIN_FILE" || true

      - name: Build Technician Pro APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "Building Android project..."
          echo "Project directory: $PWD"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Locate APK
        shell: bash
        run: |
          echo "Searching for generated APK..."

          APK_FILE="$(find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            find "$PROJECT_DIR" -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK generated:"
          echo "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      - name: Upload Technician Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: USBPhoneInfo-Technician-Pro-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
